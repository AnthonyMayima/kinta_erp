<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kinta Admin</title><link rel="stylesheet" href="/kinta-admin/assets/admin.css"></head><body>
<main id="login" class="login"><div class="login-card"><div class="brand"><span>K</span>Kinta Admin</div><h1>Business management</h1><p>Access restricted to the Kinta team.</p><div id="err" class="error"></div><label>Username<input id="user" autocomplete="username"></label><label>Password<input id="pass" type="password" autocomplete="current-password"></label><button onclick="login()">Sign in</button><small>Local : kinta-admin / kinta-admin-2026</small></div></main>

<script src="/kinta-admin/assets/admin.js"></script></body></html>
