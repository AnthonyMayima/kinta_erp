# Render Blueprint: Kinta Server 1 (Poto-Poto Shop demo) on the free plan.
# Free plan = no persistent disk: every restart or wake-up from sleep
# starts again from the demo data in kinta-backend/database/kinta.db.
services:
  - type: web
    name: kinta-erp
    runtime: node
    plan: free
    rootDir: kinta-backend
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
